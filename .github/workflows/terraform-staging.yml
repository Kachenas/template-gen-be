name: "Terraform — Staging"

on:
  pull_request:
    branches:
      - staging
    paths:
      - "sample-backend-infrastructure/terraform/**"
  push:
    branches:
      - staging
    paths:
      - "sample-backend-infrastructure/terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

concurrency:
  # PR plans are per-PR and safe to cancel/replace; apply/destroy (push or
  # manual dispatch) share one group and are never auto-cancelled, so an
  # in-progress apply can't be interrupted mid-flight.
  group: ${{ github.event_name == 'pull_request' && format('terraform-staging-plan-{0}', github.ref) || 'terraform-staging-apply' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: sample-backend-infrastructure/terraform/environments/staging

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # A pull_request event always resolves to "plan" regardless of any
      # dispatch input, and can never resolve to apply/destroy — this is
      # what keeps a PR from ever running anything but a read-only plan.
      - name: Determine action
        id: action
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=plan" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "value=apply" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug OIDC claims
        run: |
          curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sample-backend/staging/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: steps.action.outputs.value == 'plan'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Comment PR with Plan
        if: steps.action.outputs.value == 'plan' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan (Staging)

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Plan Status
        if: steps.action.outputs.value == 'plan' && steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: steps.action.outputs.value == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: steps.action.outputs.value == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform destroy -auto-approve
